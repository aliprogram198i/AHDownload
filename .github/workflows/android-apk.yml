name: AHDownload Android APK

on:
  pull_request:
  push:
    branches: [main, release/v1.9.1-runtime-fix, release/v1.10.0-final, fix/platform-download-v2]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ahdownload-android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        env:
          AH_KEYSTORE_BASE64: ${{ secrets.AH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$AH_KEYSTORE_BASE64"
          test -n "${{ secrets.AH_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.AH_KEY_ALIAS }}"
          test -n "${{ secrets.AH_KEY_PASSWORD }}"
          printf '%s' "$AH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/AHDownload-release.keystore"
          test -s "$RUNNER_TEMP/AHDownload-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/AHDownload-release.keystore" -storepass "${{ secrets.AH_KEYSTORE_PASSWORD }}" -alias "${{ secrets.AH_KEY_ALIAS }}" >/dev/null

      - name: Validate Python resolver syntax
        run: python3 -m py_compile app/src/main/python/resolver.py
      - name: Run JVM unit tests
        run: gradle --no-daemon test

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          AH_KEYSTORE_FILE: ${{ runner.temp }}/AHDownload-release.keystore
          AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
          AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
          AH_KEY_PASSWORD: ${{ secrets.AH_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Build unsigned release APK for pull request validation
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon assembleRelease

      - name: Verify signed APK exists
        if: github.event_name != 'pull_request'
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify production APK integrity and package metadata
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$BUILD_TOOLS/aapt2"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.ahdownload.app' versionCode='14' versionName='1.10.0'" "$RUNNER_TEMP/badging.txt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"

      - name: Verify unsigned PR APK exists
        if: github.event_name == 'pull_request'
        run: test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Enable KVM
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Validate Android 15 APK smoke test
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail

            diagnostics() {
              echo "::group::ADB device state"
              adb devices -l || true
              adb shell getprop ro.build.version.sdk || true
              adb shell getprop sys.boot_completed || true
              echo "::endgroup::"

              echo "::group::Package state"
              adb shell dumpsys package com.ahdownload.app || true
              adb shell dumpsys activity activities | tail -n 120 || true
              echo "::endgroup::"

              echo "::group::Recent logcat"
              adb logcat -d -t 1000 || true
              echo "::endgroup::"
            }

            adb wait-for-device

            boot_completed=""
            for _ in $(seq 1 90); do
              boot_completed="$(adb shell getprop sys.boot_completed | tr -d '\r')"
              [ "$boot_completed" = "1" ] && break
              sleep 2
            done

            if [ "$boot_completed" != "1" ]; then
              echo "ANDROID_EMULATOR_BOOT_TIMEOUT"
              diagnostics
              exit 1
            fi

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell pm path android >/dev/null

            APK=app/build/outputs/apk/release/app-release.apk
            echo "APK size: $(stat -c%s "$APK")"
            echo "APK SHA-256: $(sha256sum "$APK" | cut -d ' ' -f1)"

            if ! timeout 120s adb install -r "$APK"; then
              echo "APK_INSTALL_TIMEOUT_OR_FAILURE"
              diagnostics
              exit 1
            fi

            adb shell pm path com.ahdownload.app

            if ! timeout 60s adb shell monkey -p com.ahdownload.app 1; then
              echo "APK_LAUNCH_TIMEOUT_OR_FAILURE"
              diagnostics
              exit 1
            fi

            sleep 3

            if ! adb shell dumpsys package com.ahdownload.app | grep -q 'versionName=1.10.0'; then
              echo "APK_PACKAGE_METADATA_CHECK_FAILED"
              diagnostics
              exit 1
            fi

            mkdir -p visual-audit

            if ! timeout 8m gradle --no-daemon connectedDebugAndroidTest --console=plain; then
              echo "ANDROID_INSTRUMENTATION_TEST_TIMEOUT_OR_FAILURE"
              diagnostics
              exit 1
            fi

            for screen in home downloads studio settings; do
              if ! timeout 30s adb exec-out run-as com.ahdownload.app.debug cat "files/visual-audit/$screen.png" > "visual-audit/$screen.png"; then
                echo "VISUAL_EVIDENCE_EXTRACTION_FAILED screen=$screen"
                diagnostics
                exit 1
              fi
              test -s "visual-audit/$screen.png"
              file "visual-audit/$screen.png"
            done

      - name: Upload Android test diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AHDownload-android-test-diagnostics-${{ github.sha }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Calculate SHA-256
        id: checksum
        if: github.event_name != 'pull_request'
        run: echo "sha256=$(sha256sum app/build/outputs/apk/release/app-release.apk | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact for main and release branches
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v1.9.1-runtime-fix' || github.ref == 'refs/heads/fix/platform-download-v2') && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: AHDownload-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload visual UI evidence
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v1.10.0-final')
        uses: actions/upload-artifact@v4
        with:
          name: AHDownload-visual-audit-${{ github.sha }}
          path: visual-audit/*.png
          if-no-files-found: error

      - name: Publish GitHub Release
        if: (github.ref == 'refs/heads/release/v1.10.0-final' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.0-final
          target_commitish: ${{ github.sha }}
          name: AHDownload v1.10.0-final
          body: |
            AHDownload v1.10.0-final

            Smart Media Manager release: downloader hardening, generic file support, smart formats, diagnostics, storage intelligence, favorites, profiles and Studio integration.

            SHA-256: ${{ steps.checksum.outputs.sha256 }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

# Release branch/tag verification trigger
# CI verification marker: keep workflow_dispatch available for release validation.
