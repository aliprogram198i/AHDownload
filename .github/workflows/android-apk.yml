name: AHDownload Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        env:
          AH_KEYSTORE_BASE64: ${{ secrets.AH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$AH_KEYSTORE_BASE64"
          test -n "${{ secrets.AH_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.AH_KEY_ALIAS }}"
          test -n "${{ secrets.AH_KEY_PASSWORD }}"
          printf '%s' "$AH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/AHDownload-release.keystore"
          test -s "$RUNNER_TEMP/AHDownload-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/AHDownload-release.keystore" -storepass "${{ secrets.AH_KEYSTORE_PASSWORD }}" -alias "${{ secrets.AH_KEY_ALIAS }}" >/dev/null

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          AH_KEYSTORE_FILE: ${{ runner.temp }}/AHDownload-release.keystore
          AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
          AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
          AH_KEY_PASSWORD: ${{ secrets.AH_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Build unsigned release APK for pull request validation
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon assembleRelease
      - name: Verify signed APK exists
        if: github.event_name != 'pull_request'
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify production APK integrity and package metadata
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$BUILD_TOOLS/aapt2"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.ahdownload.app' versionCode='10' versionName='1.7.0'" "$RUNNER_TEMP/badging.txt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"

      - name: Verify unsigned PR APK exists
        if: github.event_name == 'pull_request'
        run: test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Enable KVM
        if: github.event_name != 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK on Android 15 emulator
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "APK size: $(stat -c%s app/build/outputs/apk/release/app-release.apk)"
            echo "APK SHA-256: $(sha256sum app/build/outputs/apk/release/app-release.apk | cut -d ' ' -f1)"
            adb install -r app/build/outputs/apk/release/app-release.apk || (adb logcat -d -t 400; exit 1)
            adb shell pm path com.ahdownload.app
            adb shell monkey -p com.ahdownload.app 1 || (adb logcat -d -t 400; exit 1)
            sleep 5
            adb shell dumpsys package com.ahdownload.app | grep -q 'versionName=1.7.0' || (adb shell dumpsys package com.ahdownload.app; adb logcat -d -t 600; exit 1)
            adb shell dumpsys package com.ahdownload.app | grep 'versionName=1.7.0'

      - name: Calculate SHA-256
        id: checksum
        if: github.event_name != 'pull_request'
        run: echo "sha256=$(sha256sum app/build/outputs/apk/release/app-release.apk | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: AHDownload v1.7.0
          body: |
            AHDownload v1.7.0

            Production release APK.

            SHA-256: ${{ steps.checksum.outputs.sha256 }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
