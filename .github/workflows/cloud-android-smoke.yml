name: Cloud Android Smoke Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    name: Build, install, and run Android instrumentation tests
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install project SDK components
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "platforms;android-37.1" "build-tools;36.1.0" "system-images;android-35;google_apis;x86_64"

      - name: Run JVM tests and compile APKs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cloud-test-results
          set +e
          gradle --no-daemon --no-parallel --max-workers=2 --stacktrace testDebugUnitTest assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee cloud-test-results/build-and-unit-tests.log
          test_exit_code=${PIPESTATUS[0]}
          printf '%s\n' "$test_exit_code" > cloud-test-results/build-exit-code.txt
          exit "$test_exit_code"

      - name: Boot Android emulator and run instrumentation tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none"
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle --no-daemon --no-parallel --max-workers=2 :app:connectedDebugAndroidTest

      - name: Collect emulator logs and test reports
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p cloud-test-results
          if command -v adb >/dev/null 2>&1 && adb devices 2>/dev/null | grep -qE '^emulator-[0-9]+[[:space:]]+device
          else
            printf '%s\n' "No running Android emulator was available for logcat collection." > cloud-test-results/emulator-logcat.txt
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk cloud-test-results/
          fi
          if [ -f app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ]; then
            cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk cloud-test-results/
          fi
          if [ -d app/build/outputs/androidTest-results/connected ]; then
            cp -R app/build/outputs/androidTest-results/connected cloud-test-results/instrumentation-results
          fi
          if [ -d app/build/reports/androidTests/connected ]; then
            cp -R app/build/reports/androidTests/connected cloud-test-results/instrumentation-report
          fi
          if [ -d app/build/reports/tests/testDebugUnitTest ]; then
            cp -R app/build/reports/tests/testDebugUnitTest cloud-test-results/unit-test-report
          fi
          find cloud-test-results -maxdepth 3 -type f -printf '%p (%s bytes)\n' || true

      - name: Upload APK, logs, and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahdownload-cloud-android-results-${{ github.run_id }}
          path: cloud-test-results/
          if-no-files-found: warn
          retention-days: 7
; then
            adb logcat -d -v threadtime > cloud-test-results/emulator-logcat.txt 2>&1 || echo "logcat collection failed" >> cloud-test-results/emulator-logcat.txt
          else
            printf '%s\n' "No running Android emulator was available for logcat collection." > cloud-test-results/emulator-logcat.txt
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk cloud-test-results/
          fi
          if [ -f app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ]; then
            cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk cloud-test-results/
          fi
          if [ -d app/build/outputs/androidTest-results/connected ]; then
            cp -R app/build/outputs/androidTest-results/connected cloud-test-results/instrumentation-results
          fi
          if [ -d app/build/reports/androidTests/connected ]; then
            cp -R app/build/reports/androidTests/connected cloud-test-results/instrumentation-report
          fi
          if [ -d app/build/reports/tests/testDebugUnitTest ]; then
            cp -R app/build/reports/tests/testDebugUnitTest cloud-test-results/unit-test-report
          fi
          find cloud-test-results -maxdepth 3 -type f -printf '%p (%s bytes)\n' || true

      - name: Upload APK, logs, and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahdownload-cloud-android-results-${{ github.run_id }}
          path: cloud-test-results/
          if-no-files-found: warn
          retention-days: 7
