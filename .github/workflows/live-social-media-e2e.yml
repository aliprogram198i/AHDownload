name: Live Social Media Download E2E

on:
  push:
    branches:
      - qa/live-social-media-emulator-e2e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-emulator-downloads:
    name: Real public video downloads on Android 15 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install compile SDK and build tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.1" "build-tools;36.1.0"

      - name: Compile production app and instrumentation tests
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Enable KVM access for the Android emulator
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::The GitHub runner does not expose /dev/kvm; x86_64 software emulation is not reliable for this test suite."
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run real social video downloads on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -camera-back none -camera-front none"
          script: bash .github/scripts/run-live-e2e.sh

      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p live-e2e-artifacts
          adb devices -l > live-e2e-artifacts/adb-devices.txt 2>&1 || true
          ps -ef | grep -E '[e]mulator|[q]emu-system' > live-e2e-artifacts/emulator-processes.txt || true
          if [[ -e /dev/kvm ]]; then
            ls -l /dev/kvm > live-e2e-artifacts/kvm-permissions.txt 2>&1 || true
          else
            echo "/dev/kvm is missing" > live-e2e-artifacts/kvm-permissions.txt
          fi
          for file in "$HOME"/.android/avd/test.avd/*.log /tmp/android-runner/*.log; do
            [[ -f "$file" ]] || continue
            cp "$file" live-e2e-artifacts/ || true
          done

      - name: Upload live emulator reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-social-media-e2e-results
          path: |
            live-e2e-artifacts/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
