name: Live Social Media Download E2E

on:
  push:
    branches:
      - qa/live-social-media-emulator-e2e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-emulator-downloads:
    name: Real public video downloads on Android 15 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install compile SDK and build tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.1" "build-tools;36.1.0"

      - name: Compile production app and instrumentation tests
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Run real social video downloads on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none"
          script: |
            set -eu
            mkdir -p live-e2e-artifacts
            if gradle --no-daemon --max-workers=2 -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' connectedDebugAndroidTest --stacktrace > live-e2e-artifacts/connected-debug-android-test.log 2>&1; then
              test_status=0
            else
              test_status=$?
            fi
            cat live-e2e-artifacts/connected-debug-android-test.log
            adb logcat -d -v threadtime > live-e2e-artifacts/logcat.txt 2>/dev/null || true
            adb logcat -d -v threadtime -s AH_LIVE_E2E:I AndroidRuntime:E > live-e2e-artifacts/live-test-logcat.txt 2>/dev/null || true
            exit "$test_status"

      - name: Upload live emulator reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-social-media-e2e-results
          path: |
            live-e2e-artifacts/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
