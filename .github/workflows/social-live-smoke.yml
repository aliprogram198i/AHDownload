name: Social Live Smoke

on:
  push:
    branches:
      - "test/social-live-smoke-20261008"

permissions:
  contents: read

concurrency:
  group: social-live-smoke
  cancel-in-progress: true

jobs:
  social-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run live smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disk-size: 6144M
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set +e
            mkdir -p "$GITHUB_WORKSPACE/social-smoke-artifacts"

            gradle --no-daemon connectedDebugAndroidTest               --tests com.ahdownload.app.social.SocialDownloadSmokeTest               --stacktrace
            TEST_EXIT=$?

            adb logcat -d > "$GITHUB_WORKSPACE/social-smoke-artifacts/logcat.txt" 2>&1 || true
            adb shell "run-as com.ahdownload.app sh -c 'cat /data/data/com.ahdownload.app/cache/social-smoke/report.txt'"               > "$GITHUB_WORKSPACE/social-smoke-artifacts/report.txt" 2>&1 || true

            if [ -d app/build/reports/androidTests/connected ]; then
              cp -R app/build/reports/androidTests/connected                 "$GITHUB_WORKSPACE/social-smoke-artifacts/android-tests-report"
            fi

            exit "$TEST_EXIT"

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-live-smoke-report
          path: social-smoke-artifacts/
          if-no-files-found: warn
