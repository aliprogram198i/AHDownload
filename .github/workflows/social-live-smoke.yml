name: Social Live Smoke

on:
  push:
    branches:
      - "test/social-live-smoke-20261008"

permissions:
  contents: read

jobs:
  social-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run live smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disk-size: 6144M
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            gradle --no-daemon connectedDebugAndroidTest --tests com.ahdownload.app.social.SocialDownloadSmokeTest

      - name: Collect instrumentation artifacts
        if: always()
        run: |
          set +e
          mkdir -p social-smoke-artifacts
          adb logcat -d > social-smoke-artifacts/logcat.txt || true
          adb shell "run-as com.ahdownload.app sh -c 'cat /data/data/com.ahdownload.app/cache/social-smoke/report.txt'" > social-smoke-artifacts/report.txt 2>/dev/null || true

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-live-smoke-report
          path: social-smoke-artifacts/
          if-no-files-found: warn
