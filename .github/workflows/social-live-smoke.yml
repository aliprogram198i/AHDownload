name: Social Live Smoke

on:
  push:
    branches:
      - "test/social-live-smoke-20261008"

permissions:
  contents: read

concurrency:
  group: social-live-smoke
  cancel-in-progress: true

jobs:
  social-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Install Android SDK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Create clean Android emulator
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_EMULATOR_HOME="$HOME/.android"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name social-smoke --package "system-images;android-35;google_apis;x86_64" --device "pixel_2" --path "$ANDROID_AVD_HOME/social-smoke.avd" --force
          test -f "$ANDROID_AVD_HOME/social-smoke.ini"
          emulator -list-avds | grep -Fx "social-smoke"

      - name: Run live smoke test on Android emulator
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_EMULATOR_HOME="$HOME/.android"
          mkdir -p "$GITHUB_WORKSPACE/social-smoke-artifacts"

          emulator -list-avds > "$GITHUB_WORKSPACE/social-smoke-artifacts/avds.txt" 2>&1 || true
          emulator -avd social-smoke -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -accel on -netdelay none -netspeed full > "$GITHUB_WORKSPACE/social-smoke-artifacts/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > "$GITHUB_WORKSPACE/social-smoke-artifacts/emulator.pid"

          adb start-server >/dev/null 2>&1 || true
          if ! timeout 180s adb wait-for-device; then
            echo "ADB did not detect the emulator within 180 seconds."
            cat "$GITHUB_WORKSPACE/social-smoke-artifacts/emulator.log" || true
            adb devices -l || true
            kill "$EMULATOR_PID" 2>/dev/null || true
            wait "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi

          BOOTED=0
          for i in $(seq 1 180); do
            booted="$(adb -e shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = "1" ]; then
              BOOTED=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before boot completed."
              break
            fi
            sleep 5
          done

          if [ "$BOOTED" -ne 1 ]; then
            echo "Android emulator did not reach boot_completed=1."
            adb devices -l || true
            adb -e logcat -d > "$GITHUB_WORKSPACE/social-smoke-artifacts/logcat.txt" 2>&1 || true
            cat "$GITHUB_WORKSPACE/social-smoke-artifacts/emulator.log" || true
            kill "$EMULATOR_PID" 2>/dev/null || true
            wait "$EMULATOR_PID" 2>/dev/null || true
            exit 1
          fi

          echo "Emulator booted successfully."
          adb -e shell settings put global window_animation_scale 0.0 || true
          adb -e shell settings put global transition_animation_scale 0.0 || true
          adb -e shell settings put global animator_duration_scale 0.0 || true

          gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ahdownload.app.social.SocialDownloadSmokeTest --stacktrace
          TEST_EXIT=$?

          adb -e logcat -d > "$GITHUB_WORKSPACE/social-smoke-artifacts/logcat.txt" 2>&1 || true
          adb -e shell "run-as com.ahdownload.app sh -c 'cat /data/data/com.ahdownload.app/cache/social-smoke/report.txt'" > "$GITHUB_WORKSPACE/social-smoke-artifacts/report.txt" 2>&1 || true
          if [ -d app/build/reports/androidTests/connected ]; then
            cp -R app/build/reports/androidTests/connected "$GITHUB_WORKSPACE/social-smoke-artifacts/android-tests-report"
          fi

          adb -e emu kill >/dev/null 2>&1 || true
          wait "$EMULATOR_PID" 2>/dev/null || true
          exit "$TEST_EXIT"

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-live-smoke-report
          path: social-smoke-artifacts/
          if-no-files-found: warn
