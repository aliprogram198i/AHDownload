name: Resolver Smoke Test

on:
  workflow_dispatch:

jobs:
  resolver:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test supplied real URLs
        run: |
          python -m pip install --disable-pip-version-check "yt-dlp==2026.8.19"
          python scripts/smoke_resolver.py
