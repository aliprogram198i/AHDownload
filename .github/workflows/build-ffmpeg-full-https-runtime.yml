name: Build AHDownload FFmpeg Full HTTPS Runtime

on:
  push:
    branches:
      - fix/ffmpeg-https-media-matrix
    paths:
      - ".github/workflows/build-ffmpeg-full-https-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    name: Build and verify one LGPL Full + HTTPS AAR
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout AHDownload
        uses: actions/checkout@v5

      - name: Checkout maintained FFmpegKit source at the tested release
        uses: actions/checkout@v5
        with:
          repository: ffmpegkit-maintained/ffmpeg
          ref: "469e560b89a9ba4cab357d2c306c676b0c611745"
          path: ffmpeg-source
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FFmpeg build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config curl git \
            build-essential yasm nasm gperf texinfo bison ragel python3 python3-pip \
            unzip zip wget meson ninja-build doxygen cmake autogen autopoint \
            groff gtk-doc-tools libtasn1-bin

      - name: Install Android platform
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"

      - name: Cache Android NDK r27c
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/.ndk
          key: ahdownload-ffmpeg-ndk-r27c-linux

      - name: Download Android NDK r27c
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ndk"
          curl -fL --retry 3 "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -o "$RUNNER_TEMP/ndk.zip"
          unzip -q -o "$RUNNER_TEMP/ndk.zip" -d "$HOME/.ndk"

      - name: Export NDK path
        run: |
          set -euo pipefail
          NDK_DIR="$(find "$HOME/.ndk" -mindepth 1 -maxdepth 1 -type d -name 'android-ndk-*' -print -quit)"
          test -n "$NDK_DIR"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Restore public full-tier build checkpoint when available
        working-directory: ffmpeg-source/android-8.1-lts
        run: |
          set -euo pipefail
          if git -C .. ls-remote --exit-code --heads origin ci-cache-81-free-full >/dev/null 2>&1; then
            git -C .. fetch --depth=1 origin ci-cache-81-free-full
            git -C .. archive FETCH_HEAD | tar -x
          else
            echo "No compatible public build checkpoint; building from the pinned source."
          fi

      - name: Build LGPL Full with GnuTLS HTTPS support
        working-directory: ffmpeg-source/android-8.1-lts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          touch build.log
          ./android.sh --full \
            --enable-gnutls --enable-gmp \
            --enable-android-media-codec --enable-android-zlib \
            --disable-lib-openssl \
            --disable-lib-tesseract --disable-lib-leptonica \
            --disable-lib-srt --disable-lib-chromaprint \
            --disable-arm-v7a --disable-arm-v7a-neon --disable-x86

      - name: Verify toolchain and Android native-library alignment
        working-directory: ffmpeg-source/android-8.1-lts
        run: |
          set -euo pipefail
          python3 ../tools/check-ndk.py
          python3 ../tools/check-security-patches.py
          python3 ../tools/check-elf-16kb.py prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar

      - name: Verify HTTPS and codecs are present in the produced AAR
        working-directory: ffmpeg-source/android-8.1-lts
        run: |
          set -euo pipefail
          AAR="prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar"
          test -s "$AAR"
          mkdir -p "$RUNNER_TEMP/ffmpeg-aar-inspect"
          unzip -q "$AAR" -d "$RUNNER_TEMP/ffmpeg-aar-inspect"
          find "$RUNNER_TEMP/ffmpeg-aar-inspect/jni" -type f -name 'libavformat.so' -print -quit | grep -q .
          find "$RUNNER_TEMP/ffmpeg-aar-inspect/jni" -type f -name 'libavcodec.so' -print -quit | grep -q .
          for LIB in "$RUNNER_TEMP"/ffmpeg-aar-inspect/jni/*/libavformat.so; do
            test -s "$LIB"
            strings "$LIB" | grep -Fxq https
            strings "$LIB" | grep -Eiq 'gnutls'
          done
          for LIB in "$RUNNER_TEMP"/ffmpeg-aar-inspect/jni/*/libavcodec.so; do
            test -s "$LIB"
          done
          python3 ../tools/check-filters.py "$AAR" --tier full --pin "$(awk '/^  ffmpeg\)/,/;;/' scripts/source.sh | grep -oE 'SOURCE_ID="[^"]+"' | head -1 | cut -d'"' -f2)"

      - name: Stage the verified LGPL AAR
        run: |
          set -euo pipefail
          mkdir -p runtime-artifact
          cp ffmpeg-source/android-8.1-lts/prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar runtime-artifact/ahdownload-ffmpeg-full-https-8.1.9.aar
          (
            cd runtime-artifact
            sha256sum ahdownload-ffmpeg-full-https-8.1.9.aar > ahdownload-ffmpeg-full-https-8.1.9.aar.sha256
          )
          cat runtime-artifact/ahdownload-ffmpeg-full-https-8.1.9.aar.sha256

      - name: Publish versioned verified runtime asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ahdownload-ffmpeg-full-https-8.1.9-r1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              runtime-artifact/ahdownload-ffmpeg-full-https-8.1.9.aar \
              runtime-artifact/ahdownload-ffmpeg-full-https-8.1.9.aar.sha256 --clobber
          else
            gh release create "$TAG" \
              runtime-artifact/ahdownload-ffmpeg-full-https-8.1.9.aar \
              runtime-artifact/ahdownload-ffmpeg-full-https-8.1.9.aar.sha256 \
              --target main \
              --title "AHDownload FFmpeg Full + HTTPS Runtime 8.1.9 r1" \
              --notes "Custom LGPL FFmpegKit 8.1.9 AAR built from ffmpegkit-maintained/ffmpeg commit 469e560 with full media codecs plus GnuTLS/GMP HTTPS support and OpenSSL disabled to avoid TLS backend conflicts. Includes the native AAR and SHA-256 file; publication occurs only after build and binary checks pass."
          fi

      - name: Upload verified runtime build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahdownload-ffmpeg-full-https-runtime-8.1.9
          path: runtime-artifact/
          if-no-files-found: error
          retention-days: 14
