name: Production verification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AH_KEYSTORE_FILE: ${{ runner.temp }}/AHDownload-release.keystore
      AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
      AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
      AH_KEY_PASSWORD: ${{ secrets.AH_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Accept required Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify signing configuration
        env:
          AH_KEYSTORE_BASE64: ${{ secrets.AH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$AH_KEYSTORE_BASE64"
          test -n "$AH_KEYSTORE_PASSWORD"
          test -n "$AH_KEY_ALIAS"
          test -n "$AH_KEY_PASSWORD"
          printf '%s' "$AH_KEYSTORE_BASE64" | base64 --decode > "$AH_KEYSTORE_FILE"
          test -s "$AH_KEYSTORE_FILE"
          keytool -list -keystore "$AH_KEYSTORE_FILE"             -storepass "$AH_KEYSTORE_PASSWORD"             -alias "$AH_KEY_ALIAS" >/dev/null
          echo "Release signing material is present and the configured alias is readable."

      - name: Verify resolver regression
        run: |
          python -m pip install --disable-pip-version-check "yt-dlp==2026.8.19"
          python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/apksigner" verify --print-certs "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AHDownload-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
