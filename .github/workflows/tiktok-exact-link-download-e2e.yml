name: TikTok Exact-Link Download Acceptance

on:
  push:
    branches:
      - fix/tiktok-webview-public-embed-20261019
      - fix/tiktok-exact-link-cdn-coverage-20261019
      - test/tiktok-reported-link-7693866295887940870-20261020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-public-video-download:
    name: Resolve, validate, download, and verify the reported TikTok video
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-35" "platforms;android-37.1" "build-tools;36.1.0" "system-images;android-35;google_apis;x86_64"; then
              exit 0
            fi
            echo "Android SDK install attempt $attempt failed; clearing partial emulator-image downloads before retry." >&2
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/temp"
            rm -rf "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
            sleep "$((attempt * 5))"
          done
          echo "Android SDK components could not be installed after three attempts." >&2
          exit 1

      - name: Compile app and tests
        run: |
          set -euo pipefail
          gradle --no-daemon --no-parallel --max-workers=2 --stacktrace testDebugUnitTest assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM access for the Android emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run real TikTok download acceptance on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -camera-back none -camera-front none"
          script: bash .github/scripts/run-tiktok-exact-link-e2e.sh

      - name: Validate the real-download acceptance report
        if: always()
        run: |
          set -euo pipefail
          report="$(find app/build/outputs/androidTest-results/connected -name test-result.textproto -print -quit)"
          if [[ -z "$report" || ! -s "$report" ]]; then
            echo "Missing Android instrumentation report; real download is not verified." >&2
            exit 1
          fi
          grep -q '^test_status: PASSED$' "$report"
          if grep -q 'FAIL | TikTok |' tiktok-e2e-results/logcat.txt; then
            echo "TikTok exact-link resolve/download failed; see the target-scoped logs." >&2
            exit 1
          fi
          grep -q 'PASS | TikTok |' tiktok-e2e-results/logcat.txt

      - name: Upload target-scoped report, logs, and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-exact-link-download-${{ github.run_id }}
          path: |
            tiktok-e2e-results/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
