name: TikTok Exact-Link Download Acceptance

on:
  push:
    branches:
      - fix/tiktok-webview-public-embed-20261019
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-public-video-download:
    name: Resolve, validate, download, and verify the reported TikTok video
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "platforms;android-37.1" "build-tools;36.1.0" "system-images;android-35;google_apis;x86_64"

      - name: Compile app and tests
        run: |
          set -euo pipefail
          gradle --no-daemon --no-parallel --max-workers=2 --stacktrace testDebugUnitTest assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM access for the Android emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run real TikTok download acceptance on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -camera-back none -camera-front none"
          script: |
            set -uo pipefail
            mkdir -p tiktok-e2e-results
            set +e
            gradle --no-daemon --no-parallel --max-workers=2 :app:connectedDebugAndroidTest \
              "-Pandroid.testInstrumentationRunnerArguments.class=com.ahdownload.app.download.LiveSocialMediaDownloadE2ETest" \
              "-Pandroid.testInstrumentationRunnerArguments.targetPlatform=TikTok" \
              "-Pandroid.testInstrumentationRunnerArguments.tiktokUrl=https://www.tiktok.com/@user4709652214847/video/7697553870800588050" \
              2>&1 | tee tiktok-e2e-results/instrumentation.log
            test_exit_code=$?
            adb logcat -d -v threadtime -s AH_LIVE_E2E:I AndroidRuntime:E > tiktok-e2e-results/logcat.txt 2>&1 || echo "Logcat collection failed" >> tiktok-e2e-results/logcat.txt
            printf '%s\n' "$test_exit_code" > tiktok-e2e-results/instrumentation-exit-code.txt
            exit "$test_exit_code"

      - name: Validate the real-download acceptance report
        if: always()
        run: |
          set -euo pipefail
          report="$(find app/build/outputs/androidTest-results/connected -name test-result.textproto -print -quit)"
          if [[ -z "$report" || ! -s "$report" ]]; then
            echo "Missing Android instrumentation report; real download is not verified." >&2
            exit 1
          fi
          grep -q '^test_status: PASSED$' "$report"
          if grep -q 'FAIL | TikTok |' tiktok-e2e-results/logcat.txt; then
            echo "TikTok exact-link resolve/download failed; see the target-scoped logs." >&2
            exit 1
          fi
          grep -q 'PASS | TikTok |' tiktok-e2e-results/logcat.txt

      - name: Upload target-scoped report, logs, and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-exact-link-download-${{ github.run_id }}
          path: |
            tiktok-e2e-results/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
