name: Internal Public Media Download Matrix

on:
  push:
    branches:
      - test/internal-media-download-matrix-2026-10-12
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-download-matrix:
    name: Resolve, download, and verify 20 URLs on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "platforms;android-37.1" "build-tools;36.1.0" "system-images;android-35;google_apis;x86_64"
      - name: Compile app and test suite
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run production pipeline for all 20 URLs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data"
          script: |
            bash -o pipefail -c 'gradle --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ahdownload.app.download.PublicMediaDownloadMatrixE2ETest 2>&1 | tee public-media-matrix.log'
            test_status=$?
            adb logcat -d -v threadtime -s AH_MEDIA_MATRIX:I AndroidRuntime:E > public-media-matrix-logcat.txt || true
            exit "$test_status"
      - name: Upload matrix report and device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahdownload-public-media-matrix-${{ github.run_id }}
          path: |
            public-media-matrix.log
            public-media-matrix-logcat.txt
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
