name: FFmpeg HTTPS and XNXX Media Acceptance

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-unit-tests:
    name: Run domain unit tests independently
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Run domain unit tests
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' :domain:test
      - name: Upload domain unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahdownload-domain-unit-report-${{ github.run_id }}
          path: domain/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14

  production-download-matrix:
    name: Verify HTTPS MP4/HLS/DASH and the requested XNXX URL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "platforms;android-37.1" "build-tools;36.1.0" "system-images;android-35;google_apis;x86_64"
      - name: Compile app and test suite
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run FFmpeg HTTPS fixture matrix and the requested XNXX download
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data"
          script: |
            set -euo pipefail
            validate_instrumentation_results() {
              label="$1"
              report="$(find app/build/outputs/androidTest-results/connected -name test-result.textproto -print -quit)"
              if [ -z "$report" ] || [ ! -s "$report" ]; then
                echo "Instrumentation report missing for $label; execution is not verified." >&2
                return 1
              fi
              if ! grep -q "^test_status: PASSED$" "$report"; then
                echo "Instrumentation report did not pass for $label." >&2
                cat "$report"
                return 1
              fi
              scheduled_count="$(sed -n 's/^  scheduled_test_case_count: \\([0-9][0-9]*\\)$/\\1/p' "$report" | head -n 1)"
              test_count="$(grep -c "^  test_case {" "$report" || true)"
              passed_count="$(grep -c "^  test_status: PASSED$" "$report" || true)"
              failed_count="$(grep -c "^  test_status: FAILED$" "$report" || true)"
              echo "$label test counts: scheduled=$scheduled_count; executed=$test_count; passed=$passed_count; failed=$failed_count"
              if [ -z "$scheduled_count" ] || [ "$scheduled_count" -le 0 ] || [ "$test_count" -ne "$scheduled_count" ] || [ "$passed_count" -ne "$test_count" ] || [ "$failed_count" -ne 0 ]; then
                echo "Every scheduled instrumentation test must execute and pass." >&2
                return 1
              fi
            }

            if gradle --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ahdownload.app.download.FfmpegHttpsProtocolSmokeTest 2>&1 | tee ffmpeg-https-matrix.log; then
              protocol_status=0
            else
              protocol_status=$?
            fi
            adb logcat -d -v threadtime -s AH_FFMPEG_HTTPS_MATRIX:I AndroidRuntime:E > ffmpeg-https-matrix-logcat.txt || true
            if [ "$protocol_status" -ne 0 ]; then exit "$protocol_status"; fi
            validate_instrumentation_results "FFmpeg HTTPS matrix"

            rm -rf app/build/outputs/androidTest-results/connected app/build/reports/androidTests/connected
            if gradle --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ahdownload.app.download.PublicMediaDownloadMatrixE2ETest 2>&1 | tee single-url-download.log; then
              download_status=0
            else
              download_status=$?
            fi
            adb logcat -d -v threadtime -s AH_MEDIA_MATRIX:I AndroidRuntime:E > single-url-download-logcat.txt || true
            if [ "$download_status" -ne 0 ]; then exit "$download_status"; fi
            validate_instrumentation_results "requested XNXX end-to-end test"
      - name: Upload media acceptance logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahdownload-media-acceptance-${{ github.run_id }}
          path: |
            ffmpeg-https-matrix.log
            ffmpeg-https-matrix-logcat.txt
            single-url-download.log
            single-url-download-logcat.txt
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
