name: YouTube Live Search Acceptance

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-search:
    name: Verify real YouTube search result parsing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install project SDK components
        run: sdkmanager "platforms;android-37.1" "build-tools;36.1.0"

      - name: Run live YouTube search acceptance
        id: live-search
        env:
          AH_YOUTUBE_LIVE_ACCEPTANCE: "true"
        run: |
          set -euo pipefail
          # Keep external-service acceptance honest while retrying transient failures.
          # This workflow is scheduled/manual, so it does not gate deterministic PR builds.
          for attempt in 1 2 3; do
            if gradle --no-daemon :domain:test --tests com.ahdownload.domain.resolver.youtube.YouTubeSearchLiveAcceptanceTest 2>&1 | tee "youtube-live-search-attempt-${attempt}.log"; then
              cp "youtube-live-search-attempt-${attempt}.log" youtube-live-search.log
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          echo "YouTube live search acceptance failed after three attempts." >&2
          exit 1

      - name: Upload live-search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-live-search-acceptance
          path: |
            youtube-live-search.log
            youtube-live-search-attempt-*.log
            domain/build/test-results/test/
            domain/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7
