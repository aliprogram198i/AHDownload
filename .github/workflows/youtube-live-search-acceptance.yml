name: YouTube Live Search Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-search:
    name: Verify real YouTube search result parsing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install project SDK components
        run: sdkmanager "platforms;android-37.1" "build-tools;36.1.0"

      - name: Run live YouTube search acceptance
        id: live-search
        env:
          AH_YOUTUBE_LIVE_ACCEPTANCE: "true"
        run: |
          set -o pipefail
          gradle --no-daemon :domain:test --tests com.ahdownload.domain.resolver.youtube.YouTubeSearchLiveAcceptanceTest 2>&1 | tee youtube-live-search.log

      - name: Upload live-search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-live-search-acceptance
          path: |
            youtube-live-search.log
            domain/build/test-results/test/
            domain/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7
