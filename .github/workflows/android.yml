name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-37.1" "build-tools;36.1.0"

      - name: Compile and test
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-37.1" "build-tools;36.1.0"

      - name: Prepare release signing
        env:
          AH_KEYSTORE_FILE: ${{ github.workspace }}/.ci-release.keystore
          AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
          AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
          AH_KEY_PASSWORD: ${{ secrets.AH_KEY_PASSWORD }}
          AH_KEYSTORE_BASE64: ${{ secrets.AH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$AH_KEYSTORE_BASE64"
          test -n "$AH_KEYSTORE_PASSWORD"
          test -n "$AH_KEY_ALIAS"
          test -n "$AH_KEY_PASSWORD"

          printf '%s' "$AH_KEYSTORE_BASE64" | base64 --decode > "$AH_KEYSTORE_FILE"
          test -s "$AH_KEYSTORE_FILE"

          keytool -list             -keystore "$AH_KEYSTORE_FILE"             -storepass "$AH_KEYSTORE_PASSWORD"             -alias "$AH_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          AH_KEYSTORE_FILE: ${{ github.workspace }}/.ci-release.keystore
          AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
          AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
          AH_KEY_PASSWORD: ${{ secrets.AH_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle --no-daemon assembleRelease             -PAH_KEYSTORE_FILE="$AH_KEYSTORE_FILE"             -PAH_KEYSTORE_PASSWORD="$AH_KEYSTORE_PASSWORD"             -PAH_KEY_ALIAS="$AH_KEY_ALIAS"             -PAH_KEY_PASSWORD="$AH_KEY_PASSWORD"

      - name: Re-sign release APK with V1/V2/V3
        env:
          AH_KEYSTORE_FILE: ${{ github.workspace }}/.ci-release.keystore
          AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
          AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
          AH_KEY_PASSWORD: ${{ secrets.AH_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          test -s "$APK"
          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$AH_KEYSTORE_FILE" \
            --ks-key-alias "$AH_KEY_ALIAS" \
            --ks-pass "env:AH_KEYSTORE_PASSWORD" \
            --key-pass "env:AH_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "${APK}.resigned" \
            "$APK"

          mv "${APK}.resigned" "$APK"

      - name: Verify release APK integrity and installability
        env:
          AH_KEYSTORE_FILE: ${{ github.workspace }}/.ci-release.keystore
          AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
          AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT2="$BUILD_TOOLS/aapt2"

          test -s "$APK"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT2"

          echo "== ZIP/APK integrity =="
          unzip -t "$APK" >/dev/null

          echo "== ZIP alignment =="
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          echo "== APK signature =="
          "$APKSIGNER" verify             --verbose             --print-certs             --min-sdk-version 24             "$APK" | tee apksigner-verify.txt

          grep -q "Verified" apksigner-verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" apksigner-verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner-verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" apksigner-verify.txt

          KEY_CERT_SHA256="$(
            keytool -list -v               -keystore "$AH_KEYSTORE_FILE"               -storepass "$AH_KEYSTORE_PASSWORD"               -alias "$AH_KEY_ALIAS" |
              awk -F': ' '/SHA256:/{print $2; exit}' |
              tr -d '[:space:]:' |
              tr '[:lower:]' '[:upper:]'
          )"

          APK_CERT_SHA256="$(
            awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' apksigner-verify.txt |
              tr -d '[:space:]:' |
              tr '[:lower:]' '[:upper:]'
          )"

          test -n "$KEY_CERT_SHA256"
          test -n "$APK_CERT_SHA256"
          test "$KEY_CERT_SHA256" = "$APK_CERT_SHA256"

          echo "== APK metadata =="
          BADGING="$("$AAPT2" dump badging "$APK")"
          printf '%s\n' "$BADGING" > apk-badging.txt

          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          test -n "$PACKAGE_LINE"
          printf '%s\n' "$PACKAGE_LINE" | grep -q "name='com.ahdownload.app'"

          VERSION_CODE="$(
            printf '%s\n' "$PACKAGE_LINE" |
              sed -n "s/.*versionCode='\([^']*\)'.*/\1/p"
          )"
          VERSION_NAME="$(
            printf '%s\n' "$PACKAGE_LINE" |
              sed -n "s/.*versionName='\([^']*\)'.*/\1/p"
          )"

          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -gt 0
          test -n "$VERSION_NAME"

          echo "applicationId=com.ahdownload.app"
          echo "versionCode=$VERSION_CODE"
          echo "versionName=$VERSION_NAME"

          echo "== APK checksum =="
          sha256sum "$APK" | tee app-release.apk.sha256

      - name: Install and launch APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm path com.ahdownload.app
            adb shell monkey -p com.ahdownload.app 1
            sleep 3
            adb shell dumpsys package com.ahdownload.app | grep -q 'versionName=1.3.3'

      - name: Package verification outputs
        run: |
          set -euo pipefail
          mkdir -p release-verification
          cp app/build/outputs/apk/release/app-release.apk release-verification/
          cp app-release.apk.sha256 release-verification/
          cp apksigner-verify.txt release-verification/
          cp apk-badging.txt release-verification/

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahdownload-release-apk
          path: release-verification/
          if-no-files-found: error

      - name: Publish direct release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="release-${{ github.run_id }}"
          gh release create "$TAG"             release-verification/app-release.apk             release-verification/app-release.apk.sha256             --title "AHDownload Release ${{ github.run_number }}"             --notes "Official signed release APK from commit ${{ github.sha }}. APK integrity, alignment, package metadata, and signing certificate continuity were verified before publication."
