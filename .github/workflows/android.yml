name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
      AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
      AH_KEY_PASSWORD: ${{ secrets.AH_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.1.0"
      - name: Prepare official release signing
        env:
          AH_KEYSTORE_BASE64: ${{ secrets.AH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          export AH_KEYSTORE_FILE="$RUNNER_TEMP/AHDownload-release.keystore"
          echo "AH_KEYSTORE_FILE=$AH_KEYSTORE_FILE" >> "$GITHUB_ENV"
          test -n "$AH_KEYSTORE_BASE64"
          test -n "$AH_KEYSTORE_PASSWORD"
          test -n "$AH_KEY_ALIAS"
          test -n "$AH_KEY_PASSWORD"
          printf '%s' "$AH_KEYSTORE_BASE64" | base64 --decode > "$AH_KEYSTORE_FILE"
          test -s "$AH_KEYSTORE_FILE"
          keytool -list -keystore "$AH_KEYSTORE_FILE" -storepass "$AH_KEYSTORE_PASSWORD" -alias "$AH_KEY_ALIAS" >/dev/null
      - name: Compile and test
        run: gradle --no-daemon testDebugUnitTest
      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease
      - name: Verify release APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          test -f "$APK"
          test -x "$APKSIGNER"
          set +e
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 4 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --min-sdk-version 24 "$APK" 2>&1 | tee apksigner-verify.txt
          VERIFY_STATUS=${PIPESTATUS[0]}
          set -e
          test "$VERIFY_STATUS" -eq 0
          grep -E "Verified using v[123] scheme|Number of signers" apksigner-verify.txt
          "$APKSIGNER" verify --print-certs "$APK" 2>&1 | tee apksigner-certs.txt
          grep -E "Signer #1 certificate SHA-256 digest:" apksigner-certs.txt
          jarsigner -verify -certs "$APK" >/dev/null
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ahdownload-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish direct release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="release-${{ github.run_id }}"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk --title "AHDownload Release ${{ github.run_number }}" --notes "Official signed release APK from commit ${{ github.sha }}"
