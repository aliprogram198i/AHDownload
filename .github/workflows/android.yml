name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.1.0"

      - name: Compile and test
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.1.0"

      - name: Prepare release signing
        env:
          AH_KEYSTORE_FILE: ${{ github.workspace }}/.ci-release.keystore
          AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
          AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
          AH_KEY_PASSWORD: ${{ secrets.AH_KEY_PASSWORD }}
          AH_KEYSTORE_BASE64: ${{ secrets.AH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$AH_KEYSTORE_BASE64"
          test -n "$AH_KEYSTORE_PASSWORD"
          test -n "$AH_KEY_ALIAS"
          test -n "$AH_KEY_PASSWORD"
          printf '%s' "$AH_KEYSTORE_BASE64" | base64 --decode > "$AH_KEYSTORE_FILE"
          test -s "$AH_KEYSTORE_FILE"
          keytool -list -keystore "$AH_KEYSTORE_FILE" -storepass "$AH_KEYSTORE_PASSWORD" -alias "$AH_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          AH_KEYSTORE_FILE: ${{ github.workspace }}/.ci-release.keystore
          AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
          AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
          AH_KEY_PASSWORD: ${{ secrets.AH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease             -PAH_KEYSTORE_FILE="$AH_KEYSTORE_FILE"             -PAH_KEYSTORE_PASSWORD="$AH_KEYSTORE_PASSWORD"             -PAH_KEY_ALIAS="$AH_KEY_ALIAS"             -PAH_KEY_PASSWORD="$AH_KEY_PASSWORD"

      - name: Verify release signing
        env:
          AH_KEYSTORE_FILE: ${{ github.workspace }}/.ci-release.keystore
          AH_KEYSTORE_PASSWORD: ${{ secrets.AH_KEYSTORE_PASSWORD }}
          AH_KEY_ALIAS: ${{ secrets.AH_KEY_ALIAS }}
          AH_KEY_PASSWORD: ${{ secrets.AH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          gradle --no-daemon :app:signingReport             -PAH_KEYSTORE_FILE="$AH_KEYSTORE_FILE"             -PAH_KEYSTORE_PASSWORD="$AH_KEYSTORE_PASSWORD"             -PAH_KEY_ALIAS="$AH_KEY_ALIAS"             -PAH_KEY_PASSWORD="$AH_KEY_PASSWORD" | tee signing-report.txt
          grep -q "Variant: release" signing-report.txt
          grep -q "SHA-256" signing-report.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ahdownload-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish direct release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="release-${{ github.run_id }}"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk             --title "AHDownload Release ${{ github.run_number }}"             --notes "Official signed release APK from commit ${{ github.sha }}"
