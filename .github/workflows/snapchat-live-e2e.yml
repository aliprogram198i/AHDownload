name: Snapchat Live Download Test

on:
  push:
    branches: ["fix/snapchat-spotlight-extraction"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapchat-live-e2e:
    name: Resolve and download a public Spotlight video
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install emulator image and compile test APKs
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "platforms;android-37.1" "build-tools;36.1.0" "system-images;android-35;google_apis;x86_64"
          gradle --no-daemon --no-parallel --max-workers=2 testDebugUnitTest assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM access
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run the live Snapchat acceptance test on Android emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none"
          disable-animations: true
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          script: |
            set +e
            gradle --no-daemon --no-parallel --max-workers=2 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ahdownload.app.download.LiveSocialMediaDownloadE2ETest -Pandroid.testInstrumentationRunnerArguments.targetPlatform=Snapchat > snapchat-live-e2e.log 2>&1
            test_exit_code=$?
            cat snapchat-live-e2e.log
            adb logcat -d -v threadtime > snapchat-emulator-logcat.txt 2>&1 || true
            printf '%s\\n' "$test_exit_code" > snapchat-live-exit-code.txt
            exit "$test_exit_code"
      - name: Upload Snapchat live test logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapchat-live-e2e-results-${{ github.run_id }}
          path: |
            snapchat-live-e2e.log
            snapchat-emulator-logcat.txt
            snapchat-live-exit-code.txt
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
